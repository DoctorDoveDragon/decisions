[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "decisions"
version = "0.1.0"
description = "Comparative Decision Intelligence platform"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [ { name = "DoctorDoveDragon" } ]

dependencies = [
    "streamlit>=1.0"
]

[project.scripts]
decisions-dashboard = "decisions.cli:launch"

[tool.setuptools.packages.find]
where = ["."]
decisions-dashboard = "decisions.dashboard.app:main"

[tool.setuptools.packages.find]
include = ["decisions*"]
