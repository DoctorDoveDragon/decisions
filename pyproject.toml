[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "decisions"
version = "0.1.0"
description = "Comparative Decision Intelligence platform"
readme = "README.md"
requires-python = ">=3.8"
authors = [ { name = "DoctorDoveDragon" } ]

dependencies = [
    "streamlit>=1.0"
]

[project.scripts]
decisions-dashboard = "decisions.cli:launch"

[tool.setuptools.packages.find]
where = ["."]
include = ["decisions*"]
